var LABELS = { g: "グルメ", s: "お菓子・土産", c: "工芸品" };
var PREFS = RAW.map(function (line) {
  var f = line.split("|");
  var split = function (t) { return t.split("、").map(function (x) { return x.trim(); }).filter(Boolean); };
  return { code: f[0], name: f[1], en: f[2], region: f[3], g: split(f[4]), s: split(f[5]), c: split(f[6]) };
});

var state = { q: "", cat: "all" };
var main = document.getElementById("main");
var statusEl = document.getElementById("status");
var colorOf = function (id) { return "var(--r-" + id + ")"; };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

var total = PREFS.reduce(function (n, p) { return n + p.g.length + p.s.length + p.c.length; }, 0);
document.getElementById("total").textContent = total;

var jumps = document.getElementById("jumps");
REGIONS.forEach(function (r) {
  var a = el("a", "jump", r[1]);
  a.href = "#" + r[0];
  var dot = el("i");
  dot.style.setProperty("--c", colorOf(r[0]));
  a.insertBefore(dot, a.firstChild);
  jumps.appendChild(a);
});

function render() {
  var q = state.q.trim().toLowerCase();
  var cats = state.cat === "all" ? ["g", "s", "c"] : [state.cat];
  main.textContent = "";
  var shownPrefs = 0, shownItems = 0;

  REGIONS.forEach(function (r) {
    var sec = el("section", "region");
    sec.id = r[0];
    sec.style.setProperty("--c", colorOf(r[0]));
    var grid = el("div", "grid");
    var count = 0;

    PREFS.filter(function (p) { return p.region === r[0]; }).forEach(function (p) {
      var nameHit = q && (p.name.toLowerCase().indexOf(q) >= 0 || p.en.toLowerCase().indexOf(q) >= 0);
      var blocks = [];
      cats.forEach(function (k) {
        var items = p[k].filter(function (t) { return !q || nameHit || t.toLowerCase().indexOf(q) >= 0; });
        if (items.length) blocks.push([k, items]);
      });
      if (!blocks.length) return;

      var card = el("article", "pref");
      var head = el("div", "head");
      head.appendChild(el("span", "code", p.code));
      head.appendChild(el("h3", null, p.name));
      head.appendChild(el("span", "en", p.en));
      card.appendChild(head);
      blocks.forEach(function (b) {
        var wrap = el("div", "cat " + b[0]);
        wrap.appendChild(el("p", "lab", LABELS[b[0]]));
        var ul = el("ul", "chips");
        b[1].forEach(function (t) { ul.appendChild(el("li", null, t)); });
        wrap.appendChild(ul);
        card.appendChild(wrap);
        shownItems += b[1].length;
      });
      card.style.setProperty("--c", colorOf(r[0]));
      grid.appendChild(card);
      count++; shownPrefs++;
    });

    if (!count) return;
    var h2 = el("h2", null, r[1]);
    h2.appendChild(el("small", null, r[2] + " / " + count + "都道府県"));
    sec.appendChild(h2);
    sec.appendChild(grid);
    main.appendChild(sec);
  });

  if (!shownPrefs) {
    main.appendChild(el("p", "empty", "「" + state.q + "」に合う名物は見つかりませんでした。別のことばで試してください。"));
  }
  statusEl.textContent = shownPrefs + "都道府県 / " + shownItems + "品を表示中";
}

document.getElementById("q").addEventListener("input", function (e) {
  state.q = e.target.value;
  render();
});
document.getElementById("cats").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  state.cat = b.getAttribute("data-cat");
  Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
    x.setAttribute("aria-pressed", x === b ? "true" : "false");
  });
  render();
});
render();
</script>
